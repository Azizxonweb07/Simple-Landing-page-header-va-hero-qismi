<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nextcent</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="box">
      <!-- Header start -->
      <header class="header">
        <div class="header-inside container">
          <div class="header-logo">
            <img src="image/header-logo-img.svg" alt="it is header-logo" />
          </div>
          <nav class="header-nav">
            <ul class="nav-list">
              <li class="nav-item">
                <a href="#" class="nav-link">Home</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">Service</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">Feature</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">Product</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">Testimonial</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">FAQ</a>
              </li>
            </ul>
          </nav>
          <div class="header-btn-box">
            <button>Login</button>
            <button>Sign up</button>
          </div>
        </div>
      </header>
      <!-- Header end -->
      <!-- Lessons start -->
      <section class="lessons">
        <div class="lessons-inside container">
          <div class="lessons-left">
            <h1>Lessons and insights <span>from 8 years</span></h1>
            <p>
              Where to grow your business as a photographer: site or social
              media?
            </p>
            <button>Register</button>
          </div>
          <div class="lessons-right">
            <img src="image/lessons-img.png" alt="it is lessons-img" />
          </div>
        </div>
      </section>
      <!-- Lessons end -->
    </div>
  </body>
</html>
